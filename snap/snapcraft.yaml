# Snap der Werkbank (für den Snap Store). Bauen: packaging/snap/bauen.sh
# Der Lizenzgeber ist ein eigener, nur lokaler Snap: packaging/snap/lizenzgeber/
name: jz-werkbank
title: JZ Werkbank
base: core24
version: '1.5.0'
summary: Schreibwerkzeug für technische Bücher
description: |
  Markdown-Editor mit Sprach- und Code-Prüfung, Statistik, nativem Buchsatz
  (Typst-PDF, EPUB) und Cover-Designer.

  Im Snap mitgeliefert: Hunspell-Wörterbücher (de, en, fr, es). Nicht enthalten, weil
  du sie selbst installieren kannst: LanguageTool und Java (Sprachprüfung über einen
  Server auf deinem Rechner, Anleitung in den Einstellungen), Pandoc, Typst-Programm,
  Python, Ghostscript, Rust, Dart und Flutter. Programme deines Systems kann ein Snap
  wegen der Sandbox nicht starten. Wer Rust-/Dart-Code-Prüfer, PDF/X-3-Druckdatei oder
  eigene Bauskripte braucht, nimmt das DEB-, RPM- oder Flatpak-Paket. Der Skript-Prüfer
  für Bash-Beispiele funktioniert im Snap.

  Die JZ Werkbank ist proprietäre Software (Lizenzvereinbarung im Paket unter
  share/doc/werkbank). Zum Freischalten wird ein Lizenzschlüssel gebraucht.
license: Proprietary
website: https://werkbank.jurzel-apps.de
contact: kontakt@jurzel.de
icon: snap/gui/jz-werkbank.png
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:

apps:
  jz-werkbank:
    command: bin/werkbank-app
    extensions: [gnome]
    plugs:
      - home
      - network

parts:
  werkbank:
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - gcc
      - pkg-config
      - libxkbcommon-dev
      - libwayland-dev
      - libgtk-3-dev
      - libssl-dev
    override-build: |
      set -eu
      RUST=1.99.1
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup" CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      curl -fsSL https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init -o rustup-init
      chmod +x rustup-init
      ./rustup-init -y --no-modify-path --profile minimal --default-toolchain "$RUST"
      export PATH="$CARGO_HOME/bin:$PATH"
      cargo build --release --locked -p werkbank-app
      install -Dm755 target/release/werkbank-app "$CRAFT_PART_INSTALL/bin/werkbank-app"
      tc="$RUSTUP_HOME/toolchains/$RUST-x86_64-unknown-linux-gnu"
      install -d "$CRAFT_PART_INSTALL/share/doc/werkbank"
      # Lizenztexte der Rust-Standardbibliothek, die im Programm steckt (MIT/Apache-2.0 verlangen sie bei der Weitergabe)
      install -d "$CRAFT_PART_INSTALL/share/doc/rust"
      cp -a "$tc/share/doc/rust/." "$CRAFT_PART_INSTALL/share/doc/rust/"
      test -d "$CRAFT_PART_INSTALL/share/doc/rust/licenses"
      install -m644 README.md LIZENZVEREINBARUNG.md packaging/snap/DRITTANBIETER.md assets/lizenzen.txt assets/lizenztexte.txt assets/schriften-lizenzen.txt "$CRAFT_PART_INSTALL/share/doc/werkbank/"

  laufzeit:
    plugin: nil
    stage-packages:
      - xdg-utils
      - hunspell-de-de
      - hunspell-en-us
      - hunspell-en-gb
      - hunspell-fr
      - hunspell-es
