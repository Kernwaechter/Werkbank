# Baut Release-Pakete für Linux, Windows und macOS (Workflow nicht lokal getestet).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ziel: linux
          - os: windows-latest
            ziel: windows
          - os: macos-latest
            ziel: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Abhängigkeiten (Linux)
        if: matrix.ziel == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev libssl-dev pkg-config
      - name: Tests
        run: cargo test --workspace
      - name: Release bauen
        run: cargo build --release -p werkbank-app
      - name: Debian-Paket und RPM (Linux)
        if: matrix.ziel == 'linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p werkbank-app --no-build
          cargo generate-rpm -p crates/werkbank-app
      - name: macOS-App
        if: matrix.ziel == 'macos'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release -p werkbank-app
      - name: Windows signieren (nur mit hinterlegtem Zertifikat)
        if: matrix.ziel == 'windows' && env.WIN_PFX_BASE64 != ''
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("zertifikat.pfx", [Convert]::FromBase64String($env:WIN_PFX_BASE64))
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign /f zertifikat.pfx /p $env:WIN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\werkbank-app.exe
      - name: macOS signieren und notarisieren (nur mit Apple-Zugangsdaten)
        if: matrix.ziel == 'macos' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORT: ${{ secrets.APPLE_APP_PASSWORT }}
          APPLE_ZERTIFIKAT_BASE64: ${{ secrets.APPLE_ZERTIFIKAT_BASE64 }}
          APPLE_ZERTIFIKAT_PASSWORT: ${{ secrets.APPLE_ZERTIFIKAT_PASSWORT }}
          APPLE_IDENTITAET: ${{ secrets.APPLE_IDENTITAET }}
        run: |
          echo "$APPLE_ZERTIFIKAT_BASE64" | base64 --decode > zertifikat.p12
          security create-keychain -p tmp build.keychain && security default-keychain -s build.keychain
          security unlock-keychain -p tmp build.keychain
          security import zertifikat.p12 -k build.keychain -P "$APPLE_ZERTIFIKAT_PASSWORT" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k tmp build.keychain
          codesign --force --options runtime --deep --sign "$APPLE_IDENTITAET" target/release/bundle/osx/Werkbank.app
          ditto -c -k --keepParent target/release/bundle/osx/Werkbank.app Werkbank.zip
          xcrun notarytool submit Werkbank.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORT" --wait
          xcrun stapler staple target/release/bundle/osx/Werkbank.app
      - uses: actions/upload-artifact@v4
        with:
          name: werkbank-${{ matrix.ziel }}
          path: |
            target/release/werkbank-app
            target/release/werkbank-app.exe
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/release/bundle/osx/*.app
          if-no-files-found: ignore

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Abhängigkeiten bereitstellen (der Flatpak-Bau läuft ohne Netz)
        run: cargo vendor --locked packaging/flatpak/vendor > /dev/null
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: werkbank.flatpak
          manifest-path: packaging/de.daehn.Werkbank.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: werkbank-flatpak
          path: werkbank.flatpak

  pruefsummen:
    needs: [bauen, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
      - name: Prüfsummen
        run: cd pakete && find . -type f -print0 | xargs -0 sha256sum > ../SHA256SUMS
      - name: Detached GPG-Signatur (nur mit hinterlegtem Schlüssel)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pruefsummen
          path: |
            SHA256SUMS
            SHA256SUMS.asc
          if-no-files-found: ignore
