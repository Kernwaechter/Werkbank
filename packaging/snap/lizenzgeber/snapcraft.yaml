# NUR LOKAL: dieser Snap enthält den PRIVATEN Schlüssel. Nie in den Snap Store hochladen,
# nie weitergeben. Bauen: packaging/snap/lizenzgeber-bauen.sh (legt snap/ in einem Arbeitsordner an).
name: werkbank-lizenzgeber
title: Werkbank Lizenzgeber
base: core24
version: '1.3.0'
summary: Lizenzschlüssel für die Werkbank ausstellen (privat)
description: |
  Stellt Lizenzschlüssel aus und führt das Kundenregister. Enthält den privaten
  Schlüssel; nur auf eigenen Rechnern installieren (snap install --dangerous).
license: Proprietary
website: https://werkbank.jurzel-apps.de
icon: snap/gui/werkbank-lizenzgeber.png
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:

apps:
  werkbank-lizenzgeber:
    command: bin/werkbank-lizenz-gui
    extensions: [gnome]
    plugs: [home, network, network-bind]
    environment: &umgebung
      # Register und Schlüssel überleben Aktualisierungen des Snaps (~/snap/werkbank-lizenzgeber/common/)
      WERKBANK_LIZENZGEBER: $SNAP_USER_COMMON/lizenzgeber
      WERKBANK_LIZENZGEBER_VORLAGE: $SNAP/share/werkbank-lizenzgeber
  cli:
    command: bin/werkbank-lizenz
    plugs: [home, network, network-bind]
    environment: *umgebung

parts:
  lizenzgeber:
    plugin: nil
    source: .
    build-packages: [curl, ca-certificates, gcc, pkg-config, libxkbcommon-dev, libwayland-dev, libgtk-3-dev, libssl-dev]
    override-build: |
      set -eu
      RUST=1.99.1
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup" CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      curl -fsSL https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init -o rustup-init
      chmod +x rustup-init
      ./rustup-init -y --no-modify-path --profile minimal --default-toolchain "$RUST"
      export PATH="$CARGO_HOME/bin:$PATH"
      cargo build --release --locked -p werkbank-lizenz
      install -Dm755 target/release/werkbank-lizenz "$CRAFT_PART_INSTALL/bin/werkbank-lizenz"
      install -Dm755 target/release/werkbank-lizenz-gui "$CRAFT_PART_INSTALL/bin/werkbank-lizenz-gui"
      install -Dm644 schluessel/privat.key schluessel/oeffentlich.key -t "$CRAFT_PART_INSTALL/share/werkbank-lizenzgeber"
      install -Dm644 LIZENZ-vertrieb.md -t "$CRAFT_PART_INSTALL/share/doc/werkbank-lizenzgeber"
