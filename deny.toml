# Lizenz- und Sicherheitsprüfung der Abhängigkeiten: `cargo install cargo-deny && cargo deny check`
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Zlib", "Unlicense", "CC0-1.0", "BSL-1.0", "0BSD", "NCSA", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
