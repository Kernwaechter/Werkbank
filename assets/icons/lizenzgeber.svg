<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Werkbank Lizenzgeber</title>
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5a3e"/>
      <stop offset="1" stop-color="#0b1810"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#c8962e"/>
    </linearGradient>
    <linearGradient id="platte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19c58a"/>
      <stop offset="1" stop-color="#00875a"/>
    </linearGradient>
  </defs>
  <!-- Grund wie beim Werkbank-Symbol -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#grund)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#00875a" stroke-width="8"/>
  <!-- Schlüssel: Ring mit Loch, Schaft, zwei Bärte -->
  <g transform="rotate(-35 256 200)">
    <circle cx="176" cy="200" r="76" fill="url(#gold)"/>
    <circle cx="176" cy="200" r="30" fill="#123a28"/>
    <rect x="236" y="182" width="190" height="36" rx="10" fill="url(#gold)"/>
    <rect x="352" y="214" width="26" height="46" rx="6" fill="url(#gold)"/>
    <rect x="394" y="214" width="26" height="62" rx="6" fill="url(#gold)"/>
  </g>
  <!-- Werkbank: Platte, Beine, Querstrebe -->
  <rect x="84" y="318" width="344" height="38" rx="12" fill="url(#platte)"/>
  <rect x="118" y="356" width="38" height="96" rx="7" fill="#00875a"/>
  <rect x="356" y="356" width="38" height="96" rx="7" fill="#00875a"/>
  <rect x="156" y="398" width="200" height="18" fill="#007049"/>
</svg>
