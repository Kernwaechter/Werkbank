[package]
name = "werkbank-satz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Nativer Buchsatz: Markdown nach Typst (PDF) und EPUB, ohne Skripte"

[dependencies]
werkbank-kern = { path = "../werkbank-kern" }
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
typst = "0.13.1"
typst-pdf = "0.13.1"
typst-kit = { version = "0.13.1", features = ["fonts", "embed-fonts"] }
epub-builder = "0.8.3"
typst-assets = { version = "0.13.1", features = ["fonts"] }
ttf-parser = "0.24.1"
typst-render = "0.13.1"
regex = "1"
serde_yaml = "0.9"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
