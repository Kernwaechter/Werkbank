[package]
name = "werkbank-satz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Nativer Buchsatz: Markdown nach Typst (PDF) und EPUB, ohne Skripte"

[dependencies]
werkbank-kern = { path = "../werkbank-kern" }
pulldown-cmark = "0.13"
typst = "0.13.1"
typst-pdf = "0.13.1"
typst-kit = { version = "0.13.1", features = ["fonts", "embed-fonts"] }
epub-builder = "0.8.3"
typst-assets = { version = "0.13.1", features = ["fonts"] }
ttf-parser = "0.24.1"
typst-render = "0.13.1"
