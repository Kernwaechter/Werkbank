[package]
name = "werkbank-lizenz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Verkäufer-Werkzeug: Schlüsselpaar erzeugen, Lizenzen ausstellen und prüfen (wird nicht mit der Werkbank ausgeliefert)"

[dependencies]
werkbank-kern = { path = "../werkbank-kern" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
iced = { version = "0.14.0", features = ["image"] }
rfd = "0.17.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"

[[bin]]
name = "werkbank-lizenz"
path = "src/main.rs"

[[bin]]
name = "werkbank-lizenz-gui"
path = "src/gui_main.rs"

# Pakete für den Lizenzgeber: enthalten bewusst den PRIVATEN Schlüssel (target/lizenzgeber-stage/, legt pakete-lizenzgeber.sh an).
# Nur für eigene Rechner; nie veröffentlichen.
[package.metadata.deb]
name = "werkbank-lizenzgeber"
maintainer = "Volker Dähn <volker@daehn.de>"
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0 | libx11-6"
extended-description = "Lizenzgeber der Werkbank: stellt Lizenzschlüssel aus und führt das Kundenregister. ENTHÄLT DEN PRIVATEN SCHLÜSSEL (/usr/share/werkbank-lizenzgeber/privat.key). Nicht weitergeben."
assets = [
    ["../../target/release/werkbank-lizenz", "usr/bin/", "755"],
    ["../../target/release/werkbank-lizenz-gui", "usr/bin/", "755"],
    ["../../target/lizenzgeber-stage/privat.key", "usr/share/werkbank-lizenzgeber/", "644"],
    ["../../target/lizenzgeber-stage/oeffentlich.key", "usr/share/werkbank-lizenzgeber/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/16x16/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/22x22/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/22x22/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/24x24/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/32x32/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/48x48/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/64x64/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/128x128/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/256x256/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/512x512/apps/de.daehn.Werkbank.Lizenzgeber.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../assets/icons/lizenzgeber/hicolor/scalable/apps/de.daehn.Werkbank.Lizenzgeber.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../assets/de.daehn.Werkbank.Lizenzgeber.desktop", "usr/share/applications/", "644"],
    ["../../LIZENZ-vertrieb.md", "usr/share/doc/werkbank-lizenzgeber/LIZENZ-vertrieb.md", "644"],
