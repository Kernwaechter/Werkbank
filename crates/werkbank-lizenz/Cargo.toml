    { source = "../../assets/icons/lizenzgeber/hicolor/32x32/apps/de.daehn.Werkbank.Lizenzgeber.png", dest = "/usr/share/icons/hicolor/32x32/apps/de.daehn.Werkbank.Lizenzgeber.png", mode = "644" },
