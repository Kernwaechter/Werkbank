[package.metadata.generate-rpm]
name = "werkbank-lizenzgeber"
summary = "Lizenzgeber der Werkbank (enthält den privaten Schlüssel)"
description = "Lizenzgeber der Werkbank: stellt Lizenzschlüssel aus und führt das Kundenregister. Enthält den privaten Schlüssel; nicht weitergeben."
license = "Proprietary"
group = "Applications/Publishing"
post_install_script = "gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || :"
post_uninstall_script = "gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || :"
